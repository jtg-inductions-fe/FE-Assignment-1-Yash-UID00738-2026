<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A travel agency called travlog, helps in exploring new places and book packages for holidays"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            rel="icon"
            type="image/x-icon"
            href="./public/assets/favicon/favicon.ico"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body>
        <header>
            <button
                type="button"
                class="header-ham-btn"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-menu"
            >
                <img
                    src="./public/assets/header/ham-icon.svg"
                    class="header-ham-icon"
                    alt="ham-icon"
                    width="40px"
                    height="40px"
                />
            </button>
            <div
                class="header-ham-menu"
                id="mobile-menu"
                role="navigation"
                aria-label="Mobile navigation"
            >
                <ul class="ham-menu-list">
                    <li><a href="`#home`">Home</a></li>
                    <li><a href="`#discover`">Discover</a></li>
                    <li><a href="`#special-deals`">Special Deals</a></li>
                    <li><a href="`#contact`">Contact</a></li>
                    <li>
                        <a href="`#login`" class="ham-menu-login">Log In</a>
                    </li>
                    <li>
                        <a href="`#signup`" class="ham-menu-signUp">Sign Up</a>
                    </li>
                </ul>
                <button
                    type="button"
                    class="ham-menu-close"
                    aria-label="Close navigation menu"
                >
                    &lt;
                </button>
            </div>

            <img
                src="./public/assets/header/brand-logo.svg"
                class="header-brand-logo"
                alt="brand-logo"
                width="40px"
                height="40px"
            />
            <nav class="header-nav">
                <ul class="header-nav-list">
                    <li><a href="`#home`">Home</a></li>
                    <li><a href="`#discover`">Discover</a></li>
                    <li><a href="`#special-deals`">Special Deals</a></li>
                    <li><a href="`#contact`">Contact</a></li>
                </ul>
            </nav>
            <div class="sign-btn-container">
                <button type="button" class="login-btn btn-secondary">
                    Log In
                </button>
                <button type="button" class="signUp-btn btn-primary">
                    Sign Up
                </button>
            </div>
        </header>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
