<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A travel agency called travlog, helps in exploring new places and book packages for holidays"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            type="image/x-icon"
            rel="icon"
            href="./public/assets/favicon/favicon.ico"
        />
    </head>
    <body>
        <header class="header">
            <button
                type="button"
                class="header__ham-btn"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-menu"
            >
                <img
                    src="./public/assets/header/ham-icon.svg"
                    class="header__ham-icon"
                    alt="ham-icon"
                    width="40px"
                    height="40px"
                />
            </button>

            <div
                class="header__drawer"
                id="mobile-menu"
                role="navigation"
                aria-label="Mobile navigation"
            >
                <button
                    type="button"
                    class="header__drawer-close"
                    aria-label="Close navigation menu"
                >
                    &lt;
                </button>
            </div>

            <a
                href="#home"
                class="header__brand-logo"
                aria-label="Travlog Home"
            >
                <img
                    src="./public/assets/header/brand-logo.svg"
                    class="header__brand-logo-img"
                    alt=""
                    width="40px"
                    height="40px"
                />
            </a>

            <nav class="nav-menu">
                <ul class="nav-menu__list">
                    <li class="nav-menu__item">
                        <a href="#home" class="nav-menu__link">Home</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#discover" class="nav-menu__link">Discover</a>
                    </li>
                    <li class="nav-menu__item">
                        <a href="#special-deals" class="nav-menu__link"
                            >Special Deals</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a href="#contact" class="nav-menu__link">Contact</a>
                    </li>
                    <li class="nav-menu__item nav-menu__item--auth">
                        <a href="#login" class="nav-menu__link">Log In</a>
                    </li>
                    <li class="nav-menu__item nav-menu__item--auth">
                        <a href="#sign-up" class="nav-menu__link">Sign Up</a>
                    </li>
                </ul>
            </nav>

            <div class="header__btn-container">
                <button type="button" class="btn btn--secondary">Log In</button>
                <button
                    type="button"
                    class="header__sign-up-btn btn btn--primary"
                >
                    Sign Up
                </button>
            </div>
        </header>

        <section class="hero-section">
            <div class="hero-section__images-container">
                <div class="hero-section__first-images-container">
                    <div class="first-images-container__first-image-container">
                        <img
                            src="./src/assets/images/Rectangle 1.png"
                            alt="hero-image"
                            width="200px"
                            height="220px"
                            class="first-images-container__first-image"
                        />
                        <img
                            src="./src/assets/images/Frame 16.png"
                            alt="share-image"
                            width="50px"
                            height="50px"
                            class="first-images-container__share-image"
                        />
                    </div>
                    <div class="first-images-container__second-image-container">
                        <img
                            src="./src/assets/images/Rectangle 2.png"
                            alt="hero-image"
                            width="200px"
                            height="220px"
                            class="first-images-container__second-image"
                        />
                    </div>
                </div>

                <div class="hero-section__second-images-container">
                    <div class="second-images-container__third-image-container">
                        <img
                            src="./src/assets/images/Rectangle 3.png"
                            alt="hero-image"
                            width="200px"
                            height="320px"
                            class="second-images-container__third-image"
                        />
                        <img
                            src="./src/assets/images/Frame 18.png"
                            alt="top-places-image"
                            width="70px"
                            height="30px"
                            class="second-images-container__top-places-image"
                        />
                    </div>
                </div>
                <img
                    src="./src/assets/images/Frame 17.png"
                    alt="contacts-image"
                    width="50px"
                    height="50px"
                    class="images-container__contacts-image"
                />
            </div>
        </section>

        <section class="partners-section"></section>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
