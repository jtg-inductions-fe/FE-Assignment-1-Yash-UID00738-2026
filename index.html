<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A travel agency called travlog, helps in exploring new places and book packages for holidays"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link
            rel="icon"
            type="image/x-icon"
            href="./public/assets/favicon/favicon.ico"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    </head>
    <body>
        <header>
            <button type="button" class="header-ham-btn">
                <img
                    src="./public/assets/header/ham-icon.svg"
                    class="header-ham-icon"
                    alt="ham-icon"
                    width="50px"
                    height="50px"
                />
            </button>

            <div class="header-ham-menu">
                <ul class="ham-menu-list">
                    <li><a href="">Home</a></li>
                    <li><a href="">Discover</a></li>
                    <li><a href="">Special Deals</a></li>
                    <li><a href="">Contact</a></li>
                    <li><a href="" class="ham-menu-login">Log In</a></li>
                    <li><a href="" class="ham-menu-signUp">Sign Up</a></li>
                </ul>
                <button class="ham-menu-close">&lt;</button>
            </div>

            <img
                src="./public/assets/header/brand-logo.svg"
                class="header-brand-logo"
                alt="brand-logo"
                width="40px"
                height="40px"
            />
            <nav class="header-nav">
                <ul class="header-nav-list">
                    <li><a href="">Home</a></li>
                    <li><a href="">Discover</a></li>
                    <li><a href="">Special Deals</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </nav>
            <div class="sign-btn-container">
                <button type="button" class="login-btn lighter-btn-class">
                    Log In
                </button>
                <button type="button" class="signUp-btn darken-btn-class">
                    Sign Up
                </button>
            </div>
        </header>

        <section class="hero-section"></section>
        <section class="partners-section"></section>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
